version: "2"
sql:
  - engine: "sqlite"
    queries: "db/queries/"
    schema:
      - "db/bootstrap/"
      - "db/migrations/"
    gen:
      go:
        package: "db"
        out: "db"
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_json_tags: true
        json_tags_case_style: "camel"
