<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health App - Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              DEFAULT: '#6366f1',
              dark: '#4f46e5',
            },
            secondary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              DEFAULT: '#10b981',
              dark: '#059669',
            },
            accent: {
              50: '#fff7ed',
              100: '#ffedd5',
              DEFAULT: '#f97316',
              dark: '#ea580c',
            },
            muted: {
              50: '#f5f3ff',
              100: '#ede9fe',
              DEFAULT: '#a78bfa',
              dark: '#7c3aed',
            },
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'hover': '0 10px 25px -2px rgba(0, 0, 0, 0.1)',
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gradient-to-br from-primary-50 via-white to-secondary-50">
  <div class="min-h-screen p-6">
    <!-- Header -->
    <header class="bg-gradient-to-r from-primary-600 to-secondary-600 rounded-lg p-6 mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Fitness</h1>
      <p class="text-gray-600 mt-1">Track your workouts and progress</p>
    </header>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <!-- Total Workouts -->
      <div class="bg-white rounded-lg shadow-soft p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Total Workouts</p>
            <p class="text-3xl font-bold text-blue-600">24</p>
          </div>
          <div class="bg-blue-100 p-3 rounded-full">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Total Time -->
      <div class="bg-white rounded-lg shadow-soft p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Total Time</p>
            <p class="text-3xl font-bold text-green-600">42h 15m</p>
          </div>
          <div class="bg-green-100 p-3 rounded-full">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Calorie Burn -->
      <div class="bg-white rounded-lg shadow-soft p-6">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-gray-500 text-sm">Calories Burned</p>
            <p class="text-3xl font-bold text-orange-600">3,245</p>
          </div>
          <div class="bg-orange-100 p-3 rounded-full">
            <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Workout List -->
    <div class="bg-white rounded-lg shadow-soft mb-6">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-muted-dark">Recent Workouts</h2>
      </div>
      <div class="divide-y divide-gray-200">
        <!-- Workout Item 1 -->
        <div class="p-6 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="bg-blue-100 p-3 rounded-lg">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
              </div>
              <div>
                <h3 class="font-semibold text-gray-800">Morning Jog</h3>
                <p class="text-sm text-gray-500">Today, 7:00 AM • 3.2 km • 32 min</p>
              </div>
            </div>
            <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">Cardio</span>
          </div>
        </div>

        <!-- Workout Item 2 -->
        <div class="p-6 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="bg-green-100 p-3 rounded-lg">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
              </div>
              <div>
                <h3 class="font-semibold text-gray-800">Strength Training</h3>
                <p class="text-sm text-gray-500">Yesterday, 6:30 PM • 60 min</p>
              </div>
            </div>
            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Weights</span>
          </div>
        </div>

        <!-- Workout Item 3 -->
        <div class="p-6 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="bg-purple-100 p-3 rounded-lg">
                <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
              </div>
              <div>
                <h3 class="font-semibold text-gray-800">HIIT Session</h3>
                <p class="text-sm text-gray-500">Sep 12, 7:00 PM • 25 min</p>
              </div>
            </div>
            <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-medium">HIIT</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <button class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <span class="text-gray-700 font-medium">Log Workout</span>
      </button>

      <button class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <span class="text-gray-700 font-medium">Daily Goal</span>
      </button>

      <button class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
        <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <span class="text-gray-700 font-medium">Schedule</span>
      </button>

      <button class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
        <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center mb-2">
          <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span class="text-gray-700 font-medium">Analytics</span>
      </button>
    </div>
  </div>
</body>
</html>
