<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health App Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        seaBlue: {
                            bright: '#6aa6ae',
                            text: '#185661',
                            dark: '#0a3c45'
                        },
                        forestGreen: {
                            bright: '#437456',
                            text: '#156b44',
                            dark: '#0e341f'
                        },
                        leafGreen: {
                            bright: '#e4eebc',
                            text: '#adbf73',
                            dark: '#697948'
                        },
                        pinkish: {
                            bright: '#efd6d2',
                            text: '#d2968d',
                            dark: '#b69a96'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-forestGreen-dark min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-seaBlue-dark text-leafGreen-bright p-2 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-seaBlue-bright rounded-lg flex items-center justify-center">
                <span class="text-lg">🏃</span>
            </div>
            <span class="font-semibold text-lg hidden sm:block">Health App</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-1 bg-seaBlue-bright/30 px-3 py-1 rounded-full">
                <span class="text-xl">🔥</span>
                <span class="font-medium">7 days</span>
            </div>
            <div class="text-sm text-seaBlue-text">Today, Oct 11</div>
            <div class="w-8 h-8 bg-seaBlue-bright rounded-full flex items-center justify-center">
                <span>👤</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-2 sm:p-4">
        <!-- Quick Actions -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
            <!-- Calories -->
            <div class="bg-leafGreen-bright rounded-xl p-4">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-leafGreen-bright flex items-center justify-center">
                            <span>🍎</span>
                        </div>
                        <span class="text-sm text-seaBlue-text">Calories</span>
                    </div>
                    <span class="text-sm text-forestGreen-text">85%</span>
                </div>
                <div class="text-2xl font-bold text-seaBlue-text">1,700</div>
                <div class="text-sm text-seaBlue-text mt-1">of 2,000</div>
                <div class="w-full bg-forestGreen-dark rounded-full h-2 mt-3">
                    <div class="bg-seaBlue-bright h-2 rounded-full" style="width: 85%"></div>
                </div>
            </div>
            <!-- Protein -->
            <div class="bg-leafGreen-bright rounded-xl p-4">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-leafGreen-bright flex items-center justify-center">
                            <span>💪</span>
                        </div>
                        <span class="text-sm text-seaBlue-text">Protein</span>
                    </div>
                    <span class="text-sm text-forestGreen-text">70%</span>
                </div>
                <div class="text-2xl font-bold text-seaBlue-text">72g</div>
                <div class="text-sm text-seaBlue-text mt-1">of 100g</div>
                <div class="w-full bg-forestGreen-dark rounded-full h-2 mt-3">
                    <div class="bg-seaBlue-bright h-2 rounded-full" style="width: 70%"></div>
                </div>
            </div>
            <!-- Water -->
            <div class="bg-leafGreen-bright rounded-xl p-4">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-leafGreen-bright flex items-center justify-center">
                            <span>💧</span>
                        </div>
                        <span class="text-sm text-seaBlue-text">Water</span>
                    </div>
                    <span class="text-sm text-forestGreen-text">60%</span>
                </div>
                <div class="text-2xl font-bold text-seaBlue-text">1.2L</div>
                <div class="text-sm text-seaBlue-text mt-1">of 2L</div>
                <div class="w-full bg-forestGreen-dark rounded-full h-2 mt-3">
                    <div class="bg-seaBlue-bright h-2 rounded-full" style="width: 60%"></div>
                </div>
            </div>
            <!-- Sleep -->
            <div class="bg-leafGreen-bright rounded-xl p-4">
                <div class="flex items-start justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-leafGreen-bright flex items-center justify-center">
                            <span>😴</span>
                        </div>
                        <span class="text-sm text-seaBlue-text">Sleep</span>
                    </div>
                    <span class="text-sm text-forestGreen-text">90%</span>
                </div>
                <div class="text-2xl font-bold text-seaBlue-text">7h 30m</div>
                <div class="text-sm text-seaBlue-text mt-1">of 8h</div>
                <div class="w-full bg-forestGreen-dark rounded-full h-2 mt-3">
                    <div class="bg-seaBlue-bright h-2 rounded-full" style="width: 90%"></div>
                </div>
            </div>
        </div>

        <!-- Quest Checklist -->
        <h2 class="text-lg font-semibold text-seaBlue-text mb-3">Today's Goals</h2>
        <div class="bg-leafGreen-bright rounded-xl p-4 mb-4">
            <label class="flex items-center gap-3 p-2 hover:bg-leafGreen-bright/80 rounded-lg cursor-pointer transition">
                <input type="checkbox" checked class="w-5 h-5 rounded border-seaBlue-text text-seaBlue-bright focus:ring-seaBlue-bright">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-2xl">💊</span>
                        <span class="font-medium text-seaBlue-text">Take daily vitamins</span>
                    </div>
                    <span class="text-xs text-forestGreen-text">Completed</span>
                </div>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-leafGreen-bright/80 rounded-lg cursor-pointer transition">
                <input type="checkbox" class="w-5 h-5 rounded border-seaBlue-text text-seaBlue-bright focus:ring-seaBlue-bright">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-2xl">👣</span>
                        <span class="font-medium text-seaBlue-text">10,000 steps today</span>
                    </div>
                    <span class="text-xs text-forestGreen-text">2,450 / 10,000</span>
                </div>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-leafGreen-bright/80 rounded-lg cursor-pointer transition">
                <input type="checkbox" checked class="w-5 h-5 rounded border-seaBlue-text text-seaBlue-bright focus:ring-seaBlue-bright">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-2xl">🥤</span>
                        <span class="font-medium text-seaBlue-text">Water goal (2L)</span>
                    </div>
                    <span class="text-xs text-forestGreen-text">Completed</span>
                </div>
            </label>
            <label class="flex items-center gap-3 p-2 hover:bg-leafGreen-bright/80 rounded-lg cursor-pointer transition">
                <input type="checkbox" class="w-5 h-5 rounded border-seaBlue-text text-seaBlue-bright focus:ring-seaBlue-bright">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-2xl">🧘</span>
                        <span class="font-medium text-seaBlue-text">15 min meditation</span>
                    </div>
                    <span class="text-xs text-forestGreen-text">Not started</span>
                </div>
            </label>
        </div>

        <!-- Quick Stats -->
        <div class="bg-gradient-to-r from-seaBlue-dark to-forestGreen-dark rounded-xl p-4 text-leafGreen-bright">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-sm">Weekly Points</span>
                    <div class="text-3xl font-bold">+485</div>
                    <span class="text-sm">Rank #2 in Squad</span>
                </div>
                <div class="text-4xl">🏆</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-seaBlue-dark text-leafGreen-bright border-t border-seaBlue-bright/20">
        <div class="flex justify-around items-center h-16">
            <button class="flex flex-col items-center justify-center gap-1 h-16">
                <span class="text-2xl">🏡</span>
                <span class="text-xs">Home</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 h-16">
                <span class="text-2xl">🏋️</span>
                <span class="text-xs">Workout</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 h-16">
                <span class="text-2xl">🥗</span>
                <span class="text-xs">Meal</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 h-16">
                <span class="text-2xl">📊</span>
                <span class="text-xs">Stats</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 h-16">
                <span class="text-2xl">🏆</span>
                <span class="text-xs">Squad</span>
            </button>
        </div>
    </nav>
</body>
</html>
